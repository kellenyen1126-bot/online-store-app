<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="tab">
      <button id="signin-tab" class="active">Sign In</button>
      <button id="signup-tab">Sign Up</button>
    </div>

    <!-- Sign In Form -->
    <form id="signin-form" class="login-form">
      <label>Username</label>
      <input type="text" placeholder="Enter username">

      <label>Phone Number</label>
      <input type="text" placeholder="Enter your phone number">

      <label>Password</label>
      <input type="password" placeholder="Enter password">

      <button type="submit" class="signin-btn">Sign In</button>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form" class="login-form hidden">
      <label>Username</label>
      <input type="text" placeholder="Choose a username">

      <label>Phone Number</label>
      <input type="text" placeholder="Enter your phone number">

      <label>Password</label>
      <input type="password" placeholder="Create a password">

      <button type="submit" class="signin-btn">Sign Up</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
