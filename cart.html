<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>購物車</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>購物車</h1>
  {% if cart_items %}
    <ul>
      {% for item in cart_items %}
        <li>{{ item.name }} - NT${{ item.price }} × {{ item.quantity }}</li>
      {% endfor %}
    </ul>
    <p>總金額: NT${{ total }}</p>
    <a href="/checkout"><button>結帳</button></a>
  {% else %}
    <p>購物車目前沒有商品。</p>
  {% endif %}
  <a href="/">返回商品清單</a>
</body>
</html>
