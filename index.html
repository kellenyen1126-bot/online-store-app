<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>商品清單</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>商品清單</h1>
  <ul>
    {% for product in products %}
      <li>{{ product.name }} - NT${{ product.price }}
        <a href="/add_to_cart/{{ product.id }}">加入購物車</a>
      </li>
    {% endfor %}
  </ul>
  <a href="/cart">查看購物車</a>
</body>
</html>
