<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>購物車</title>
</head>
<body>
    <h1>購物車</h1>
    <ul>
        {% for item in cart %}
            <li>
                {{ item['name'] }} - ${{ item['price'] }} x {{ item['quantity'] }}
                <form action="{{ url_for('remove_from_cart', product_id=item['id']) }}" method="post">
                    <button type="submit">移除</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <form action="{{ url_for('checkout') }}" method="post">
        <button type="submit">結帳</button>
    </form>
</body>
</html>
